---
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.go'
      - '**/*.proto'
      - .protoc-version
      - go.mod
      - go.sum

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: generated files
jobs:
  golang:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Regenerate
        run: make generate format

      - name: Verify no drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "go generate produced a diff. Run 'make generate' locally and commit the result."
            git status --short
            git diff
            exit 1
          fi

  proto:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      # Both halves of the toolchain are pinned — protoc by .protoc-version,
      # protoc-gen-go by go.mod's tool directive — because protoc-gen-go stamps
      # both versions into every file it writes. Unpinned, this job would report
      # which runner image it drew rather than whether the tree is current.
      #
      # The guard is for the empty module and nothing else: proto.sh treats a
      # tree with no proto/ directory as a misconfiguration, which is right for
      # a module that ships .proto files and wrong for one that does not ship
      # anything yet. It stops guarding the moment the first proto/ lands.
      - name: Regenerate
        run: |
          if [ -z "$(find . -type d -name proto -not -path './.git/*' -print -quit)" ]; then
            echo "no proto/ directories in this module; nothing to regenerate"
            exit 0
          fi
          make proto format

      - name: Verify no drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "make proto produced a diff. Run 'make proto format' locally and commit the result."
            git status --short
            git diff
            exit 1
          fi
